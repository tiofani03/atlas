name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: atx
            archive_format: tar.gz

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            bin_name: atx
            archive_format: tar.gz
            use_cross: true

          - os: macos-13
            target: x86_64-apple-darwin
            bin_name: atx
            archive_format: tar.gz

          - os: macos-latest
            target: aarch64-apple-darwin
            bin_name: atx
            archive_format: tar.gz

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: atx.exe
            archive_format: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross (for ARM cross-compilation)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binary
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --bin atx --target ${{ matrix.target }}
          else
            cargo build --release --bin atx --target ${{ matrix.target }}
          fi

      - name: Package archive (Unix)
        if: matrix.archive_format == 'tar.gz'
        shell: bash
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          ARCHIVE_DIR="atx-${TAG}-${{ matrix.target }}"
          mkdir -p "${ARCHIVE_DIR}"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "${ARCHIVE_DIR}/"
          cp README.md LICENSE "${ARCHIVE_DIR}/" 2>/dev/null || true
          tar -czvf "${ARCHIVE_DIR}.tar.gz" "${ARCHIVE_DIR}"
          sha256sum "${ARCHIVE_DIR}.tar.gz" > "${ARCHIVE_DIR}.tar.gz.sha256"

      - name: Package archive (Windows)
        if: matrix.archive_format == 'zip'
        shell: bash
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          ARCHIVE_DIR="atx-${TAG}-${{ matrix.target }}"
          mkdir -p "${ARCHIVE_DIR}"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "${ARCHIVE_DIR}/"
          cp README.md LICENSE "${ARCHIVE_DIR}/" 2>/dev/null || true
          7z a "${ARCHIVE_DIR}.zip" "${ARCHIVE_DIR}"
          sha256sum "${ARCHIVE_DIR}.zip" > "${ARCHIVE_DIR}.zip.sha256"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: |
            atx-*.tar.gz
            atx-*.tar.gz.sha256
            atx-*.zip
            atx-*.zip.sha256

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: package-*
          merge-multiple: true

      - name: Generate Consolidated SHA256SUMS.txt
        working-directory: release-artifacts
        run: |
          cat *.sha256 > SHA256SUMS.txt
          rm -f *.sha256
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Atlas ${{ github.ref_name }}
          files: |
            release-artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
